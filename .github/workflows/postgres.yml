# The Postgres backend's suites. ci.yml runs everything that needs no server.
#
# Postgres runs through `docker run` rather than a service container: a
# service container cannot pass `-c max_connections=300`, and every test opens
# small pools of its own. docker-compose.yml starts the same server locally.
name: Postgres

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  RUSTFLAGS: "-D warnings"
  PG_TEST_URL: postgres://explorer:explorer@localhost:5432/explorer

jobs:
  postgres:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [postgres-suites]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Start Postgres
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=explorer -e POSTGRES_PASSWORD=explorer -e POSTGRES_DB=explorer \
            -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8" \
            postgres:18.6 -c max_connections=300
          for i in $(seq 1 60); do
            docker exec pg pg_isready -U explorer -d explorer && break
            sleep 1
          done

      # Pinned to a commit, since a branch can move under us; this is the head
      # of the action's `stable` branch on 2026-10-01.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      # The tests are #[ignore]d so plain `cargo test` needs no server; here
      # they must run, and fail rather than skip if PG_TEST_URL is missing.
      - name: Migrations, locks and outages
        if: matrix.suite == 'postgres-suites'
        run: |
          cargo test --lib -- --include-ignored
          cargo test \
            --test postgres --test migrations --test locks --test outage_drills \
            -- --include-ignored

