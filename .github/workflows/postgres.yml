# The Postgres backend's suites. ci.yml runs everything that needs no server.
#
# Postgres is a service container. `command` starts it with
# `-c max_connections=300`, as docker-compose.yml does: every test opens small
# pools of its own.
name: Postgres

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  RUSTFLAGS: "-D warnings"
  PG_TEST_URL: postgres://explorer:explorer@localhost:5432/explorer

jobs:
  postgres:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6 # same tag as docker-compose.yml
        command: postgres -c max_connections=300
        env:
          POSTGRES_USER: explorer
          POSTGRES_PASSWORD: explorer
          POSTGRES_DB: explorer
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U explorer -d explorer"
          --health-interval 2s --health-timeout 3s --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        suite: [backend-matrix, postgres-suites]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Pinned to a commit, since a branch can move under us; this is the head
      # of the action's `stable` branch on 2026-10-01.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      # The network-free suites on Postgres. The db::lock tests are SQLite-only
      # test hooks, so they are skipped by name rather than edited.
      - name: Network-free suites on Postgres
        if: matrix.suite == 'backend-matrix'
        env:
          TEST_DB: postgres
        run: >
          cargo test --test decoder --test anchoring --test pages --
          --skip duplicate_bundle_is_idempotent
          --skip anchoring_events_read_back_by_registry

      # The tests are #[ignore]d so plain `cargo test` needs no server; here
      # they must run, and fail rather than skip if PG_TEST_URL is missing.
      - name: Replay, differential, grid, migrations, locks and outages
        if: matrix.suite == 'postgres-suites'
        run: |
          cargo test --lib -- --include-ignored
          cargo test --features db-coverage \
            --test postgres --test migrations --test replay --test differential \
            --test grid --test locks --test indexer_pg --test outage_drills \
            -- --include-ignored

